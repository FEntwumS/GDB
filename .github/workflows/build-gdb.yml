# .github/workflows/build-gdb.yml
#
# Builds GDB from the official GNU sources and stores the result as an
# artifact. When a tag is pushed (v*), it is also added to the
# GitHub release.
#
# Covers linux-x64, macos-arm64 and windows-x64.
#
# Deliberately three explicit jobs instead of a matrix: package management,
# configure flags and verification differ too much per platform.
#
# The Linux build runs inside an ubuntu:20.04 container rather than on a
# current runner. The reason is the binding to the host system's libraries:
# their binary compatibility only holds upwards, so an artifact produced on a
# newer distribution would not start on the VM image used in teaching
# (Ubuntu 20.04). Conversely, an artifact produced here also runs on newer
# systems. This affects both glibc and -- with scripting enabled -- libpython.

name: Build GDB

on:
  workflow_dispatch:        # triggerable (Actions-Tab -> Run workflow)
    inputs:
      with_python:
        description: 'Enable Python-Scripting'
        type: boolean
        default: true
  push:
    tags:
      - 'v*'
  pull_request:
    paths:
      - '.github/workflows/build-gdb.yml'

permissions:
    contents: write

env:
  GDB_VERSION: '17.2'
  GDB_SHA256: '1c036c0d72e4b3d1fb5c94c88632add6f9d76f4d7c4d2ea793c12a9f19a3228c'

  # Python scripting: 'true' embeds the interpreter.
  #
  #   true  -> The binary can execute GDB Python scripts, including the
  #            RAM commands from the preliminary work (e.g. Dolata's Workflow).
  #            ATTENTION: Creates a dynamic dependency on libpython
  #            in the exact version of the build environment—in this case, 3.8, which matches
  #            the VM image. On systems without this version, the
  #            binary will not start. The standard library is NOT included.
  #
  #   false -> a more streamlined artifact with fewer dependencies. Sufficient,
  #            as long as the data is displayed in the user interface.
  #
  # If you start the workflow manually, the value entered above will be overwritten.
  WITH_PYTHON: 'true'

jobs:
  build-linux:
    name: linux-x64
    runs-on: ubuntu-latest
    container:
      image: ubuntu:20.04

    steps:
      # In the container, we run as root — no sudo needed. Also, the bare image doesn't
      # include either git or curl, which is why the packages must be installed BEFORE the checkout!
      - name: Install Build Dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          # 20.04 has been out of the regular support period since May 2025.
          # If the package sources have been moved, make the following changes here:
          # sed -i 's|archive.ubuntu.com|old-releases.ubuntu.com|g; \
          #         s|security.ubuntu.com|old-releases.ubuntu.com|g' \
          #     /etc/apt/sources.list

          apt-get update
          apt-get install -y --no-install-recommends \
            build-essential \
            git \
            curl \
            ca-certificates \
            xz-utils \
            file \
            binutils \
            texinfo \
            libgmp-dev \
            libmpfr-dev \
            libexpat1-dev \
            zlib1g-dev \
            libncurses-dev

          echo "--- Environment ---"
          cat /etc/os-release | head -n 2
          ldd --version | head -n 1
          gcc --version | head -n 1

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Identify if Python variant
        id: variant
        run: |
          # The manual-dispatch input takes precedence over the env default.
          WP="${{ github.event.inputs.with_python }}"
          if [ -z "$WP" ]; then WP="${WITH_PYTHON}"; fi

          if [ "$WP" = "true" ]; then
            echo "python_flag=--with-python=/usr/bin/python3" >> "$GITHUB_OUTPUT"
            echo "suffix=-py" >> "$GITHUB_OUTPUT"
            echo "with_python=true" >> "$GITHUB_OUTPUT"
            echo "Variant: WITH Python scripting"
          else
            echo "python_flag=--without-python" >> "$GITHUB_OUTPUT"
            echo "suffix=" >> "$GITHUB_OUTPUT"
            echo "with_python=false" >> "$GITHUB_OUTPUT"
            echo "Variant: WITHOUT Python scripting"
          fi

      - name: Install Python (only if scripting is enabled)
        if: steps.variant.outputs.with_python == 'true'
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          apt-get install -y --no-install-recommends python3-dev
          echo "--- Python of the build environment ---"
          /usr/bin/python3 --version

      - name: Download Sources
        run: |
          curl -fLO "https://ftp.gnu.org/gnu/gdb/gdb-${GDB_VERSION}.tar.xz"
          echo "Actual checksum:"
          sha256sum "gdb-${GDB_VERSION}.tar.xz"

      - name: Verify Checksum
        run: |
          if [ -z "${GDB_SHA256}" ]; then
            echo "::warning::GDB_SHA256 is empty - verification skipped."
            echo "Copy the checksum printed above into the env block."
          else
            echo "${GDB_SHA256}  gdb-${GDB_VERSION}.tar.xz" | sha256sum -c -
          fi

      - name: Extract
        run: tar xf "gdb-${GDB_VERSION}.tar.xz"

      - name: configure
        run: |
          mkdir build && cd build
          ../gdb-${GDB_VERSION}/configure \
            --prefix="${GITHUB_WORKSPACE}/gdb-linux-x64" \
            --enable-targets=all \
            --with-expat \
            --with-system-zlib \
            ${{ steps.variant.outputs.python_flag }} \
            --disable-binutils \
            --disable-gas \
            --disable-ld \
            --disable-gold \
            --disable-gprof \
            --disable-sim \
            --disable-nls \
            --disable-source-highlight \
            --disable-werror \
            LDFLAGS="-static-libstdc++ -static-libgcc"

      - name: Check that GDB is part of the build plan
        # The top-level configure does not create the submodule directories
        # yet -- that only happens during "make". Therefore the generated
        # Makefile is checked instead: if gdb ends up in noconfigdirs
        # (as observed on Apple Silicon), the build target is missing there.
        run: |
          if grep -qE '^[[:space:]]*maybe-all-gdb' build/Makefile; then
            echo "OK: gdb is part of the build plan"
          else
            echo "::error::gdb is missing from the generated Makefile."
            echo "--- Hints from config.log ---"
            grep -n -iE "noconfigdirs|not supported|skipping" build/config.log \
              | head -n 20 || true
            exit 1
          fi

      - name: make
        run: |
          cd build
          make -j"$(nproc)"
          make install
          strip "${GITHUB_WORKSPACE}/gdb-linux-x64/bin/gdb"

      - name: Diagnostics after make
        # For traceability only: which modules were actually built, and
        # what ended up in the installation directory?
        if: always()
        run: |
          echo "=== built modules ==="
          ls -d build/*/ 2>/dev/null || echo "(none)"
          echo "=== installation directory ==="
          find "${GITHUB_WORKSPACE}/gdb-linux-x64" -maxdepth 2 2>/dev/null || true

      - name: Verification
        run: |
          GDB="${GITHUB_WORKSPACE}/gdb-linux-x64/bin/gdb"

          echo "--- Version ---"
          "$GDB" --version | head -n 1

          echo "--- Runtime dependencies ---"
          ldd "$GDB"

          echo "--- required glibc version (highest referenced symbol version) ---"
          # Expected: no higher than 2.31 (Ubuntu 20.04).
          objdump -T "$GDB" | grep -o 'GLIBC_[0-9.]*' | sort -uV | tail -n 3

          echo "--- Configuration ---"
          "$GDB" --configuration

          echo "--- expat ---"
          "$GDB" --configuration | grep -q -- "--with-expat" \
            && echo "OK: expat active" \
            || { echo "::error::expat missing"; exit 1; }

          echo "--- m68k (host architecture of the SVNR) ---"
          "$GDB" --batch -nx --ex 'set architecture' 2>&1 | grep -q 'm68k' \
            && echo "OK: m68k in the architecture list" \
            || { echo "::error::m68k missing - targets=all ineffective?"; exit 1; }

      - name: Python functional test
        if: steps.variant.outputs.with_python == 'true'
        run: |
          GDB="${GITHUB_WORKSPACE}/gdb-linux-x64/bin/gdb"

          # Not just "compiled in", but actually operational:
          # the interpreter must be able to find its standard library.
          OUT="$("$GDB" -batch -nx -ex "python print('py ok')" 2>&1)"
          echo "$OUT"
          echo "$OUT" | grep -q "py ok" \
            && echo "OK: Python interpreter operational" \
            || { echo "::error::Python embedded, but not operational"; exit 1; }

          echo "--- libpython dependency ---"
          # The target system must provide exactly this version.
          # Expected: libpython3.8 (as in the VM image).
          ldd "$GDB" | grep -i python \
            || echo "(no dynamic libpython reference found)"

      - name: Package
        run: |
          NAME="gdb-linux-x64${{ steps.variant.outputs.suffix }}"
          # Without a suffix (variant without Python) source and target are
          # identical and mv would fail.
          [ "$NAME" = "gdb-linux-x64" ] || mv gdb-linux-x64 "$NAME"
          tar -czf "${NAME}.tar.gz" "$NAME"
          sha256sum "${NAME}.tar.gz" | tee "${NAME}.tar.gz.sha256"
          ls -lh "${NAME}.tar.gz"
          echo "ARTIFACT_NAME=${NAME}" >> "$GITHUB_ENV"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: |
            ${{ env.ARTIFACT_NAME }}.tar.gz
            ${{ env.ARTIFACT_NAME }}.tar.gz.sha256
          retention-days: 30

      - name: Attach to release (tag push only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ env.ARTIFACT_NAME }}.tar.gz
            ${{ env.ARTIFACT_NAME }}.tar.gz.sha256

  # ---------------------------------------------------------------------------
  build-macos:
    name: macos-arm64
    runs-on: macos-14

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Identify if Python variant
        id: variant
        # Unlike the Linux job the interpreter path is not fixed here: it only
        # becomes known once Homebrew has installed Python, so the configure
        # flag is assembled later.
        run: |
          # The manual-dispatch input takes precedence over the env default.
          WP="${{ github.event.inputs.with_python }}"
          if [ -z "$WP" ]; then WP="${WITH_PYTHON}"; fi

          if [ "$WP" = "true" ]; then
            echo "suffix=-py" >> "$GITHUB_OUTPUT"
            echo "with_python=true" >> "$GITHUB_OUTPUT"
            echo "Variant: WITH Python scripting"
          else
            echo "suffix=" >> "$GITHUB_OUTPUT"
            echo "with_python=false" >> "$GITHUB_OUTPUT"
            echo "Variant: WITHOUT Python scripting"
          fi

      - name: Install Build Dependencies
        run: |
          brew install gmp mpfr texinfo

          # texinfo is keg-only on macOS. Without this the build would fall
          # back to the ancient makeinfo shipped with the system.
          echo "$(brew --prefix texinfo)/bin" >> "$GITHUB_PATH"

          echo "--- Environment ---"
          sw_vers | head -n 2
          uname -m
          clang --version | head -n 1

      - name: Install Python (only if scripting is enabled)
        if: steps.variant.outputs.with_python == 'true'
        run: |
          brew install python@3.12
          PY="$(brew --prefix python@3.12)/bin/python3.12"
          echo "PYTHON_BIN=${PY}" >> "$GITHUB_ENV"
          echo "--- Python of the build environment ---"
          "$PY" --version

      - name: Download Sources
        run: |
          curl -fLO "https://ftp.gnu.org/gnu/gdb/gdb-${GDB_VERSION}.tar.xz"
          echo "Actual checksum:"
          shasum -a 256 "gdb-${GDB_VERSION}.tar.xz"

      - name: Verify Checksum
        run: |
          if [ -z "${GDB_SHA256}" ]; then
            echo "::warning::GDB_SHA256 is empty - verification skipped."
            echo "Copy the checksum printed above into the env block."
          else
            echo "${GDB_SHA256}  gdb-${GDB_VERSION}.tar.xz" | shasum -a 256 -c -
          fi

      - name: Extract
        run: tar xf "gdb-${GDB_VERSION}.tar.xz"

      - name: configure
        run: |
          if [ "${{ steps.variant.outputs.with_python }}" = "true" ]; then
            PY_FLAG="--with-python=${PYTHON_BIN}"
          else
            PY_FLAG="--without-python"
          fi

          mkdir build && cd build

          # --target=m68k-elf is required, not cosmetic: on arm64 Darwin the
          # top-level configure puts gdb into noconfigdirs when host and target
          # are identical, because native debugging is unsupported there. A
          # differing target keeps gdb in the build plan -- and m68k is the
          # architecture we need anyway.
          #
          # No -static-libstdc++/-static-libgcc here: clang does not support
          # those flags, unlike the GCC used in the Linux job.
          ../gdb-${GDB_VERSION}/configure \
            --prefix="${GITHUB_WORKSPACE}/gdb-macos-arm64" \
            --target=m68k-elf \
            --enable-targets=all \
            --with-expat \
            --with-system-zlib \
            --with-gmp="$(brew --prefix gmp)" \
            --with-mpfr="$(brew --prefix mpfr)" \
            ${PY_FLAG} \
            --disable-binutils \
            --disable-gas \
            --disable-ld \
            --disable-gold \
            --disable-gprof \
            --disable-sim \
            --disable-nls \
            --disable-source-highlight \
            --disable-werror

      - name: Check that GDB is part of the build plan
        # Same check as in the Linux job, and here it guards the Apple Silicon
        # failure mode directly: without --target above, gdb would land in
        # noconfigdirs and the build target would be missing from the Makefile.
        run: |
          if grep -qE '^[[:space:]]*maybe-all-gdb' build/Makefile; then
            echo "OK: gdb is part of the build plan"
          else
            echo "::error::gdb is missing from the generated Makefile."
            echo "--- Hints from config.log ---"
            grep -n -iE "noconfigdirs|not supported|skipping" build/config.log \
              | head -n 20 || true
            exit 1
          fi

      - name: make
        run: |
          cd build
          make -j"$(sysctl -n hw.ncpu)"
          make install

      - name: Normalize binary name and strip
        # Signing deliberately happens later: the relocation step below runs
        # install_name_tool, which invalidates any signature.
        run: |
          PREFIX="${GITHUB_WORKSPACE}/gdb-macos-arm64"

          # A cross build (--target=m68k-elf) installs the binary as
          # m68k-elf-gdb. The plugin expects bin/gdb, so normalize the name.
          if [ ! -f "$PREFIX/bin/gdb" ]; then
            SRC="$(ls "$PREFIX"/bin/*gdb 2>/dev/null | head -n 1)"
            [ -n "$SRC" ] || { echo "::error::no gdb binary found in $PREFIX/bin"; exit 1; }
            echo "Renaming $(basename "$SRC") -> gdb"
            mv "$SRC" "$PREFIX/bin/gdb"
          fi

          strip "$PREFIX/bin/gdb"

      - name: Relocate bundle (remove Homebrew dependency)
        # Ports what build-gdb.sh used to do locally into the workflow: pull
        # every Homebrew dylib into the bundle, rewrite the absolute paths to
        # @loader_path-relative ones, and re-sign everything. Unlike the old
        # script the dylib list is not hardcoded but discovered from the
        # binary, so it follows whatever configure actually linked.
        run: |
          PREFIX="${GITHUB_WORKSPACE}/gdb-macos-arm64"
          GDB="$PREFIX/bin/gdb"
          HB="$(brew --prefix)"
          mkdir -p "$PREFIX/lib" "$PREFIX/Frameworks"

          # Relative load path from a given file back to <bundle>/<subdir>.
          # Also correct for the executable: for a Mach-O executable
          # @loader_path is its own directory.
          rel_prefix_for() {
            d="$(dirname "$1")"; up=""
            while [ "$d" != "$PREFIX" ] && [ "$d" != "/" ]; do
              up="../$up"; d="$(dirname "$d")"
            done
            printf '@loader_path/%s%s' "$up" "$2"
          }

          # --- 1. Copy in every Homebrew dylib, transitively ---------------
          # Fixed-point iteration: a freshly copied dylib can pull in more.
          while :; do
            NEW=0
            for f in "$GDB" "$PREFIX"/lib/*.dylib; do
              [ -f "$f" ] || continue
              while read -r dep; do
                case "$dep" in
                  # Frameworks are handled in step 2. Note that a shell case
                  # pattern's * also matches "/", so this must come first.
                  "$HB"/*/Frameworks/*) continue ;;
                  "$HB"/*)
                    base="$(basename "$dep")"
                    if [ ! -f "$PREFIX/lib/$base" ]; then
                      # -L follows symlinks and copies the real file
                      cp -L "$dep" "$PREFIX/lib/$base"
                      chmod u+w "$PREFIX/lib/$base"
                      echo "copied $base"
                      NEW=1
                    fi
                    ;;
                esac
              done < <(otool -L "$f" | tail -n +2 | awk '{print $1}')
            done
            if [ "$NEW" -eq 0 ]; then break; fi
          done

          # --- 2. Copy the Python framework, if the -py variant needs it ---
          FW_SRC=""
          while read -r dep; do
            case "$dep" in
              "$HB"/*/Frameworks/Python.framework/*)
                FW_SRC="${dep%%/Frameworks/*}/Frameworks/Python.framework" ;;
            esac
          done < <(otool -L "$GDB" | tail -n +2 | awk '{print $1}')

          if [ -n "$FW_SRC" ] && [ ! -d "$PREFIX/Frameworks/Python.framework" ]; then
            echo "copying $FW_SRC"
            cp -RL "$FW_SRC" "$PREFIX/Frameworks/"
          fi

          # --- 3. Rewrite every absolute Homebrew reference ----------------
          relocate() {
            t="$1"
            libp="$(rel_prefix_for "$t" lib)"
            fwp="$(rel_prefix_for "$t" Frameworks)"
            case "$t" in
              # Point the dylib's own ID at @rpath so it works from any path
              *.dylib) install_name_tool -id "@rpath/$(basename "$t")" "$t" 2>/dev/null || true ;;
            esac
            while read -r dep; do
              case "$dep" in
                "$HB"/*/Frameworks/Python.framework/*)
                  sfx="${dep#*/Frameworks/}"
                  install_name_tool -change "$dep" "$fwp/$sfx" "$t" || true ;;
                "$HB"/*)
                  install_name_tool -change "$dep" "$libp/$(basename "$dep")" "$t" || true ;;
              esac
            done < <(otool -L "$t" | tail -n +2 | awk '{print $1}')
          }

          while read -r f; do
            file "$f" | grep -q "Mach-O" || continue
            relocate "$f"
          done < <(find "$PREFIX/lib" "$PREFIX/Frameworks" -type f 2>/dev/null)

          relocate "$GDB"
          # so that the @rpath IDs of the copied dylibs resolve
          install_name_tool -add_rpath "@executable_path/../lib" "$GDB" 2>/dev/null || true

          # --- 4. Re-sign: install_name_tool invalidates signatures --------
          # "-" = ad-hoc; without a signature Gatekeeper blocks the binary on
          # other machines.
          while read -r f; do
            file "$f" | grep -q "Mach-O" || continue
            codesign --force --sign - "$f" 2>/dev/null \
              || echo "::warning::codesign failed for $f"
          done < <(find "$PREFIX" -type f)

          codesign --verify --verbose "$GDB"

      - name: Diagnostics after make
        # For traceability only: which modules were actually built, and
        # what ended up in the installation directory?
        if: always()
        run: |
          echo "=== built modules ==="
          ls -d build/*/ 2>/dev/null || echo "(none)"
          echo "=== installation directory ==="
          find "${GITHUB_WORKSPACE}/gdb-macos-arm64" -maxdepth 2 2>/dev/null || true

      - name: Verification
        run: |
          GDB="${GITHUB_WORKSPACE}/gdb-macos-arm64/bin/gdb"

          echo "--- Version ---"
          "$GDB" --version | head -n 1

          echo "--- Runtime dependencies ---"
          # otool -L instead of ldd; the glibc symbol-version check of the
          # Linux job has no macOS equivalent and is omitted.
          otool -L "$GDB"

          echo "--- Configuration ---"
          "$GDB" --configuration

          echo "--- expat ---"
          "$GDB" --configuration | grep -q -- "--with-expat" \
            && echo "OK: expat active" \
            || { echo "::error::expat missing"; exit 1; }

          echo "--- m68k (host architecture of the SVNR) ---"
          "$GDB" --batch -nx --ex 'set architecture' 2>&1 | grep -q 'm68k' \
            && echo "OK: m68k in the architecture list" \
            || { echo "::error::m68k missing - targets=all ineffective?"; exit 1; }

      - name: Portability check (no Homebrew references)
        # Now that the bundle is relocated this is a real gate, not a report:
        # a leftover absolute path means the artifact will not start on a
        # machine without Homebrew. Hard failure for the binary, warning for
        # the bundled libraries.
        run: |
          PREFIX="${GITHUB_WORKSPACE}/gdb-macos-arm64"
          HB="$(brew --prefix)"

          echo "--- otool -L bin/gdb ---"
          otool -L "$PREFIX/bin/gdb"
          if otool -L "$PREFIX/bin/gdb" | grep -q "$HB"; then
            echo "::error::binary still references $HB - relocation incomplete"
            otool -L "$PREFIX/bin/gdb" | grep "$HB"
            exit 1
          fi
          echo "OK: no $HB references in the binary"

          for lib in "$PREFIX"/lib/*.dylib; do
            [ -f "$lib" ] || continue
            if otool -L "$lib" | grep -q "$HB"; then
              echo "::warning::$(basename "$lib") still references $HB"
              otool -L "$lib" | grep "$HB" | head -n 5
            fi
          done
          echo "OK: bundled dylibs checked"

      - name: Python functional test
        if: steps.variant.outputs.with_python == 'true'
        run: |
          GDB="${GITHUB_WORKSPACE}/gdb-macos-arm64/bin/gdb"

          # Not just "compiled in", but actually operational:
          # the interpreter must be able to find its standard library.
          OUT="$("$GDB" -batch -nx -ex "python print('py ok')" 2>&1)"
          echo "$OUT"
          echo "$OUT" | grep -q "py ok" \
            && echo "OK: Python interpreter operational" \
            || { echo "::error::Python embedded, but not operational"; exit 1; }

          echo "--- Python dependency ---"
          # After relocation this should point into the bundle's Frameworks
          # directory, not at Homebrew.
          otool -L "$GDB" | grep -i python \
            || echo "(no dynamic Python reference found)"

      - name: Package
        run: |
          NAME="gdb-macos-arm64${{ steps.variant.outputs.suffix }}"
          # Without a suffix (variant without Python) source and target are
          # identical and mv would fail.
          [ "$NAME" = "gdb-macos-arm64" ] || mv gdb-macos-arm64 "$NAME"
          tar --exclude='.DS_Store' -czf "${NAME}.tar.gz" "$NAME"
          shasum -a 256 "${NAME}.tar.gz" | tee "${NAME}.tar.gz.sha256"
          ls -lh "${NAME}.tar.gz"
          echo "ARTIFACT_NAME=${NAME}" >> "$GITHUB_ENV"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: |
            ${{ env.ARTIFACT_NAME }}.tar.gz
            ${{ env.ARTIFACT_NAME }}.tar.gz.sha256
          retention-days: 30

      - name: Attach to release (tag push only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ env.ARTIFACT_NAME }}.tar.gz
            ${{ env.ARTIFACT_NAME }}.tar.gz.sha256

  # ---------------------------------------------------------------------------
  build-windows:
    name: windows-x64
    runs-on: windows-latest

    # Every run step goes through the MSYS2 shell. The two `uses` steps below
    # are unaffected by this; setup-msys2 must therefore run before the first
    # run step.
    defaults:
      run:
        shell: 'msys2 {0}'

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up MSYS2 (UCRT64)
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          # MSYS packages (build tooling) plus the UCRT64 toolchain and
          # libraries. Python is installed later, only for the -py variant.
          install: >-
            make
            texinfo
            tar
            xz
            curl
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-gmp
            mingw-w64-ucrt-x86_64-mpfr
            mingw-w64-ucrt-x86_64-expat
            mingw-w64-ucrt-x86_64-ncurses
            mingw-w64-ucrt-x86_64-zlib

      - name: Identify if Python variant
        id: variant
        run: |
          # The manual-dispatch input takes precedence over the env default.
          WP="${{ github.event.inputs.with_python }}"
          if [ -z "$WP" ]; then WP="${WITH_PYTHON}"; fi

          if [ "$WP" = "true" ]; then
            echo "suffix=-py" >> "$GITHUB_OUTPUT"
            echo "with_python=true" >> "$GITHUB_OUTPUT"
            echo "Variant: WITH Python scripting"
          else
            echo "suffix=" >> "$GITHUB_OUTPUT"
            echo "with_python=false" >> "$GITHUB_OUTPUT"
            echo "Variant: WITHOUT Python scripting"
          fi

          echo "--- Environment ---"
          echo "MSYSTEM=${MSYSTEM}"
          gcc --version | head -n 1

      - name: Install Python (only if scripting is enabled)
        if: steps.variant.outputs.with_python == 'true'
        run: |
          pacman -S --noconfirm --needed mingw-w64-ucrt-x86_64-python
          echo "--- Python of the build environment ---"
          /ucrt64/bin/python3 --version

      - name: Download Sources
        run: |
          curl -fLO "https://ftp.gnu.org/gnu/gdb/gdb-${GDB_VERSION}.tar.xz"
          echo "Actual checksum:"
          sha256sum "gdb-${GDB_VERSION}.tar.xz"

      - name: Verify Checksum
        run: |
          if [ -z "${GDB_SHA256}" ]; then
            echo "::warning::GDB_SHA256 is empty - verification skipped."
            echo "Copy the checksum printed above into the env block."
          else
            echo "${GDB_SHA256}  gdb-${GDB_VERSION}.tar.xz" | sha256sum -c -
          fi

      - name: Extract
        run: tar xf "gdb-${GDB_VERSION}.tar.xz"

      - name: configure
        run: |
          # GITHUB_WORKSPACE is a Windows path (D:\a\...); configure and make
          # need the POSIX form.
          WORK="$(cygpath -u "${GITHUB_WORKSPACE}")"

          if [ "${{ steps.variant.outputs.with_python }}" = "true" ]; then
            PY_FLAG="--with-python=/ucrt64/bin/python3"
          else
            PY_FLAG="--without-python"
          fi

          mkdir build && cd build

          # Unlike arm64 Darwin, native debugging is supported on x86_64
          # Windows, so no --target detour is needed here; the m68k support
          # comes from --enable-targets=all.
          #
          # -static avoids runtime dependencies on the MSYS2/mingw DLLs
          # (libstdc++-6, libgcc_s_seh-1, libwinpthread-1), which would not be
          # present on a target machine.
          ../gdb-${GDB_VERSION}/configure \
            --prefix="${WORK}/gdb-windows-x64" \
            --enable-targets=all \
            --with-expat \
            --with-system-zlib \
            ${PY_FLAG} \
            --disable-binutils \
            --disable-gas \
            --disable-ld \
            --disable-gold \
            --disable-gprof \
            --disable-sim \
            --disable-nls \
            --disable-source-highlight \
            --disable-werror \
            LDFLAGS="-static"

      - name: Check that GDB is part of the build plan
        # Same guard as in the other jobs: if gdb ends up in noconfigdirs, the
        # build target is missing from the generated Makefile.
        run: |
          if grep -qE '^[[:space:]]*maybe-all-gdb' build/Makefile; then
            echo "OK: gdb is part of the build plan"
          else
            echo "::error::gdb is missing from the generated Makefile."
            echo "--- Hints from config.log ---"
            grep -n -iE "noconfigdirs|not supported|skipping" build/config.log \
              | head -n 20 || true
            exit 1
          fi

      - name: make
        run: |
          WORK="$(cygpath -u "${GITHUB_WORKSPACE}")"
          cd build
          make -j"$(nproc)"
          make install
          strip "${WORK}/gdb-windows-x64/bin/gdb.exe"

      - name: Diagnostics after make
        # For traceability only: which modules were actually built, and
        # what ended up in the installation directory?
        if: always()
        run: |
          WORK="$(cygpath -u "${GITHUB_WORKSPACE}")"
          echo "=== built modules ==="
          ls -d build/*/ 2>/dev/null || echo "(none)"
          echo "=== installation directory ==="
          find "${WORK}/gdb-windows-x64" -maxdepth 2 2>/dev/null || true

      - name: Verification
        run: |
          WORK="$(cygpath -u "${GITHUB_WORKSPACE}")"
          GDB="${WORK}/gdb-windows-x64/bin/gdb.exe"

          echo "--- Version ---"
          "$GDB" --version | head -n 1

          echo "--- Runtime dependencies (imported DLLs) ---"
          # objdump instead of ldd: ldd exists under MSYS2 but reports the
          # MSYS view, not the DLLs the PE image actually imports.
          # No glibc check here -- that is Linux-specific.
          objdump -p "$GDB" | grep -i "DLL Name" | sort -u

          echo "--- Configuration ---"
          "$GDB" --configuration

          echo "--- expat ---"
          "$GDB" --configuration | grep -q -- "--with-expat" \
            && echo "OK: expat active" \
            || { echo "::error::expat missing"; exit 1; }

          echo "--- m68k (host architecture of the SVNR) ---"
          "$GDB" --batch -nx --ex 'set architecture' 2>&1 | grep -q 'm68k' \
            && echo "OK: m68k in the architecture list" \
            || { echo "::error::m68k missing - targets=all ineffective?"; exit 1; }

      - name: Portability report (MSYS2 runtime DLLs)
        # Deliberately a warning, not an error: LDFLAGS="-static" should have
        # removed these, but the -py variant necessarily keeps a dynamic
        # dependency on the mingw Python DLL.
        run: |
          WORK="$(cygpath -u "${GITHUB_WORKSPACE}")"
          GDB="${WORK}/gdb-windows-x64/bin/gdb.exe"

          DLLS="$(objdump -p "$GDB" | grep -i "DLL Name" | sort -u)"
          HITS="$(echo "$DLLS" | grep -iE 'libstdc\+\+|libgcc_s|libwinpthread|msys-2\.0' || true)"
          if [ -n "$HITS" ]; then
            echo "::warning::binary depends on MSYS2/mingw runtime DLLs - -static did not take full effect"
            echo "$HITS"
          else
            echo "OK: no MSYS2/mingw runtime DLLs referenced"
          fi

          echo "$DLLS" | grep -i python \
            || echo "(no Python DLL reference found)"

      - name: Python functional test
        if: steps.variant.outputs.with_python == 'true'
        run: |
          WORK="$(cygpath -u "${GITHUB_WORKSPACE}")"
          GDB="${WORK}/gdb-windows-x64/bin/gdb.exe"

          # Not just "compiled in", but actually operational:
          # the interpreter must be able to find its standard library.
          OUT="$("$GDB" -batch -nx -ex "python print('py ok')" 2>&1)"
          echo "$OUT"
          echo "$OUT" | grep -q "py ok" \
            && echo "OK: Python interpreter operational" \
            || { echo "::error::Python embedded, but not operational"; exit 1; }

      - name: Package
        run: |
          NAME="gdb-windows-x64${{ steps.variant.outputs.suffix }}"
          # Without a suffix (variant without Python) source and target are
          # identical and mv would fail.
          [ "$NAME" = "gdb-windows-x64" ] || mv gdb-windows-x64 "$NAME"
          tar -czf "${NAME}.tar.gz" "$NAME"
          sha256sum "${NAME}.tar.gz" | tee "${NAME}.tar.gz.sha256"
          ls -lh "${NAME}.tar.gz"
          echo "ARTIFACT_NAME=${NAME}" >> "$GITHUB_ENV"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: |
            ${{ env.ARTIFACT_NAME }}.tar.gz
            ${{ env.ARTIFACT_NAME }}.tar.gz.sha256
          retention-days: 30

      - name: Attach to release (tag push only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ env.ARTIFACT_NAME }}.tar.gz
            ${{ env.ARTIFACT_NAME }}.tar.gz.sha256
