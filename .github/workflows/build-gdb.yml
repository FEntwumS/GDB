# .github/workflows/build-gdb.yml
#
# Baut GDB aus den offiziellen GNU-Quellen und legt das Ergebnis als
# Artefakt ab. Bei einem Tag-Push (v*) wird es zusaetzlich an das
# GitHub-Release angehaengt.
#
# Stand: nur linux-x64. macOS und Windows folgen als weitere Jobs.
#
# Die Uebersetzung erfolgt in einem ubuntu:20.04-Container, nicht auf einem
# aktuellen Runner. Grund ist die Bindung an die Bibliotheken des
# Host-Systems: Deren Binaerkompatibilitaet gilt nur aufwaerts, ein auf
# einer neueren Distribution erzeugtes Artefakt liesse sich auf dem in der
# Lehre eingesetzten VM-Abbild (Ubuntu 20.04) nicht starten. Umgekehrt
# laeuft ein hier erzeugtes Artefakt auch auf neueren Systemen.
# Betrifft sowohl glibc als auch -- bei aktiviertem Scripting -- libpython.

name: Build GDB for linux-x64

on:
  workflow_dispatch:        # manuell ausloesbar (Actions-Tab -> Run workflow)
    inputs:
      with_python:
        description: 'Python-Scripting einbinden (fuer den CLI-Workflow der Vorarbeit)'
        type: boolean
        default: true
  push:
    tags:
      - 'v*'
  pull_request:
    paths:
      - '.github/workflows/build-gdb.yml'

env:
  GDB_VERSION: '17.2'
  # TODO: nach dem ersten Lauf die im Log ausgegebene Pruefsumme hier eintragen.
  # Solange leer, wird die Verifikation uebersprungen (nur Warnung).
  GDB_SHA256: ''

  # Python-Scripting: 'true' bindet den Interpreter ein.
  #
  #   true  -> Die Binary kann GDB-Python-Skripte ausfuehren, also auch die
  #            RAM-Befehle der Vorarbeit. Noetig, um den bestehenden
  #            CLI-/Eclipse-Workflow gegen das Artefakt zu testen.
  #            ACHTUNG: erzeugt eine dynamische Abhaengigkeit zu libpython
  #            in genau der Version der Bauumgebung -- hier 3.8, passend
  #            zum VM-Abbild. Auf Systemen ohne diese Version startet die
  #            Binary nicht. Die Standardbibliothek wird NICHT mitgeliefert.
  #   false -> schlankeres, abhaengigkeitsaermeres Artefakt. Ausreichend,
  #            sobald die Speicherdarstellung in der Oberflaeche erfolgt.
  #
  # Bei manuellem Start ueberschreibt die Eingabe oben diesen Wert.
  WITH_PYTHON: 'true'

jobs:
  build-linux:
    name: linux-x64
    runs-on: ubuntu-latest
    container:
      image: ubuntu:20.04

    steps:
      # Im Container laufen wir als root -- kein sudo. Ausserdem bringt das
      # nackte Image weder git noch curl mit, weshalb die Pakete VOR dem
      # Checkout installiert werden muessen.
      - name: Build-Abhaengigkeiten installieren
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          # 20.04 ist seit Mai 2025 aus dem regulaeren Wartungszeitraum.
          # Falls die Paketquellen umgezogen sind, hier umbiegen:
          # sed -i 's|archive.ubuntu.com|old-releases.ubuntu.com|g; \
          #         s|security.ubuntu.com|old-releases.ubuntu.com|g' \
          #     /etc/apt/sources.list

          apt-get update
          apt-get install -y --no-install-recommends \
            build-essential \
            git \
            curl \
            ca-certificates \
            xz-utils \
            file \
            binutils \
            texinfo \
            libgmp-dev \
            libmpfr-dev \
            libexpat1-dev \
            zlib1g-dev \
            libncurses-dev

          echo "--- Umgebung ---"
          cat /etc/os-release | head -n 2
          ldd --version | head -n 1
          gcc --version | head -n 1

      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Variante bestimmen
        id: variant
        run: |
          # Eingabe des manuellen Starts hat Vorrang vor dem env-Default.
          WP="${{ github.event.inputs.with_python }}"
          if [ -z "$WP" ]; then WP="${WITH_PYTHON}"; fi

          if [ "$WP" = "true" ]; then
            echo "python_flag=--with-python=/usr/bin/python3" >> "$GITHUB_OUTPUT"
            echo "suffix=-py" >> "$GITHUB_OUTPUT"
            echo "with_python=true" >> "$GITHUB_OUTPUT"
            echo "Variante: MIT Python-Scripting"
          else
            echo "python_flag=--without-python" >> "$GITHUB_OUTPUT"
            echo "suffix=" >> "$GITHUB_OUTPUT"
            echo "with_python=false" >> "$GITHUB_OUTPUT"
            echo "Variante: OHNE Python-Scripting"
          fi

      - name: Python installieren (nur bei aktiviertem Scripting)
        if: steps.variant.outputs.with_python == 'true'
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          apt-get install -y --no-install-recommends python3-dev
          echo "--- Python der Bauumgebung ---"
          /usr/bin/python3 --version

      - name: Quellen herunterladen
        run: |
          curl -fLO "https://ftp.gnu.org/gnu/gdb/gdb-${GDB_VERSION}.tar.xz"
          echo "Tatsaechliche Pruefsumme:"
          sha256sum "gdb-${GDB_VERSION}.tar.xz"

      - name: Pruefsumme verifizieren
        run: |
          if [ -z "${GDB_SHA256}" ]; then
            echo "::warning::GDB_SHA256 ist leer - Verifikation uebersprungen."
            echo "Trage die oben ausgegebene Summe in den env-Block ein."
          else
            echo "${GDB_SHA256}  gdb-${GDB_VERSION}.tar.xz" | sha256sum -c -
          fi

      - name: Entpacken
        run: tar xf "gdb-${GDB_VERSION}.tar.xz"

      - name: configure
        run: |
          mkdir build && cd build
          ../gdb-${GDB_VERSION}/configure \
            --prefix="${GITHUB_WORKSPACE}/gdb-linux-x64" \
            --enable-targets=all \
            --with-expat \
            --with-system-zlib \
            ${{ steps.variant.outputs.python_flag }} \
            --disable-binutils \
            --disable-gas \
            --disable-ld \
            --disable-gold \
            --disable-gprof \
            --disable-sim \
            --disable-nls \
            --disable-source-highlight \
            --disable-werror \
            LDFLAGS="-static-libstdc++ -static-libgcc"

      - name: Pruefen, ob GDB im Bauplan enthalten ist
        # Der Top-Level-configure legt die Untermodul-Verzeichnisse noch
        # nicht an -- das passiert erst waehrend "make". Geprueft wird
        # deshalb das generierte Makefile: Landet gdb in noconfigdirs
        # (wie auf Apple Silicon beobachtet), fehlt dort das Bauziel.
        run: |
          if grep -qE '^[[:space:]]*maybe-all-gdb' build/Makefile; then
            echo "OK: gdb ist im Bauplan enthalten"
          else
            echo "::error::gdb fehlt im generierten Makefile."
            echo "--- Hinweise aus config.log ---"
            grep -n -iE "noconfigdirs|not supported|skipping" build/config.log \
              | head -n 20 || true
            exit 1
          fi

      - name: make
        run: |
          cd build
          make -j"$(nproc)"
          make install
          strip "${GITHUB_WORKSPACE}/gdb-linux-x64/bin/gdb"

      - name: Diagnose nach make
        # Nur zur Nachvollziehbarkeit: welche Module wurden tatsaechlich
        # gebaut, und was ist im Installationsverzeichnis gelandet?
        if: always()
        run: |
          echo "=== gebaute Module ==="
          ls -d build/*/ 2>/dev/null || echo "(keine)"
          echo "=== Installationsverzeichnis ==="
          find "${GITHUB_WORKSPACE}/gdb-linux-x64" -maxdepth 2 2>/dev/null || true

      - name: Verifikation
        run: |
          GDB="${GITHUB_WORKSPACE}/gdb-linux-x64/bin/gdb"

          echo "--- Version ---"
          "$GDB" --version | head -n 1

          echo "--- Laufzeitabhaengigkeiten ---"
          ldd "$GDB"

          echo "--- benoetigte glibc-Version (hoechste referenzierte Symbolversion) ---"
          # Erwartet: nicht hoeher als 2.31 (Ubuntu 20.04).
          objdump -T "$GDB" | grep -o 'GLIBC_[0-9.]*' | sort -uV | tail -n 3

          echo "--- Konfiguration ---"
          "$GDB" --configuration

          echo "--- expat ---"
          "$GDB" --configuration | grep -q -- "--with-expat" \
            && echo "OK: expat aktiv" \
            || { echo "::error::expat fehlt"; exit 1; }

          echo "--- m68k (Traegerarchitektur des SVNR) ---"
          "$GDB" --batch -nx --ex 'set architecture' 2>&1 | grep -q 'm68k' \
            && echo "OK: m68k in der Architekturliste" \
            || { echo "::error::m68k fehlt - targets=all wirkungslos?"; exit 1; }

      - name: Python-Funktionstest
        if: steps.variant.outputs.with_python == 'true'
        run: |
          GDB="${GITHUB_WORKSPACE}/gdb-linux-x64/bin/gdb"

          # Nicht nur "einkompiliert", sondern tatsaechlich lauffaehig:
          # der Interpreter muss seine Standardbibliothek finden.
          OUT="$("$GDB" -batch -nx -ex "python print('py ok')" 2>&1)"
          echo "$OUT"
          echo "$OUT" | grep -q "py ok" \
            && echo "OK: Python-Interpreter funktionsfaehig" \
            || { echo "::error::Python eingebunden, aber nicht lauffaehig"; exit 1; }

          echo "--- libpython-Abhaengigkeit ---"
          # Das Zielsystem muss genau diese Version bereitstellen.
          # Erwartet: libpython3.8 (wie im VM-Abbild).
          ldd "$GDB" | grep -i python \
            || echo "(keine dynamische libpython-Referenz gefunden)"

      - name: Paketieren
        run: |
          NAME="gdb-linux-x64${{ steps.variant.outputs.suffix }}"
          mv gdb-linux-x64 "$NAME"
          tar -czf "${NAME}.tar.gz" "$NAME"
          sha256sum "${NAME}.tar.gz" | tee "${NAME}.tar.gz.sha256"
          ls -lh "${NAME}.tar.gz"
          echo "ARTIFACT_NAME=${NAME}" >> "$GITHUB_ENV"

      - name: Artefakt hochladen
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: |
            ${{ env.ARTIFACT_NAME }}.tar.gz
            ${{ env.ARTIFACT_NAME }}.tar.gz.sha256
          retention-days: 30

      - name: An Release anhaengen (nur bei Tag-Push)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ env.ARTIFACT_NAME }}.tar.gz
            ${{ env.ARTIFACT_NAME }}.tar.gz.sha256
